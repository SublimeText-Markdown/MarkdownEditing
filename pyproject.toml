[project]
name = "MarkdownEditing"
version = "3.6.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.black]
exclude = '''
      \.git
    | \.github
    | \.pytest_cache
    | \.ruff_cache
    | \.venv
    | plugin\.py
    | tests
'''
line-length = 100
target-version = ['py38']

[tool.ruff]
exclude = [
  ".git",
  ".github",
  ".pytest_cache",
  ".ruff_cache",
  "tests"
]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
ignore = [
  "BLE001",
  "E722",      # bare except
  "S110"       # `try`-`except`-`pass` detected, consider logging the exception
]

[tool.ruff.lint.per-file-ignores]
"plugin.py" = ["F401"]
